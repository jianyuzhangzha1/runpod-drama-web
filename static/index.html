<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>片场 · RunPod Studio</title><link rel="stylesheet" href="/static/style.css"></head><body>
<aside><div class="brand">◒ <b>片场</b><span>RUNPOD STUDIO</span></div><button id="new" class="primary wide">＋ 新建短片</button><nav id="projects"></nav><div class="aside-bottom">从一个镜头，到一个故事。<br><small>LOCAL WORKSPACE · v0.1</small></div></aside>
<main><header><span>工作台 / 短片制作</span><span id="mode" class="badge">连接中</span></header><section class="heading"><div><div class="eyebrow">YOUR STORY, FRAME BY FRAME</div><h1 id="title">让故事，开始发生。</h1><p id="style">创建短片，编排分镜，再把画面变成故事。</p></div><button id="assemble" class="primary" hidden>合成初剪 ↗</button></section>
<div id="notice" class="notice" hidden></div><div id="stats" class="stats"></div><div class="section-head"><h2>分镜工作台 <span id="count"></span></h2><div><button id="export" hidden>导出分镜 JSON</button> <button id="add" hidden>＋ 添加镜头</button></div></div>
<div id="shots" class="shots"><div class="empty">建立你的第一个短片项目<br><small>关键帧 · 动作提示 · 逐镜生成 · 初剪输出</small><button id="sample">载入示例项目 →</button></div></div>
<section id="tasks" hidden><div class="section-head"><h2>制作记录</h2><small>自动更新 · 每 4 秒</small></div><div id="jobs"></div></section>
</main><dialog id="projectDialog"><form id="projectForm"><h2>新建短片</h2><label>短片名称<input name="title" required maxlength="120" placeholder="例如：黎明之前"></label><label>统一视觉风格<textarea name="style" rows="3">黑白胶片，写实，克制，16:9 横构图</textarea></label><footer><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">创建项目</button></footer></form></dialog>
<dialog id="shotDialog"><form id="shotForm"><h2>编辑镜头</h2><input type="hidden" name="id"><div class="two"><label>镜头名称<input name="title" required maxlength="120"></label><label>排序<input name="position" type="number" min="1" max="1000" required></label></div><label>关键帧提示词<textarea name="image_prompt" rows="3" placeholder="构图、人物、场景与光线"></textarea></label><label>动作与运镜提示词<textarea name="video_prompt" rows="3" placeholder="主要动作、运镜、结束状态；可包含环境音描述"></textarea></label><div class="two"><label>时长<select name="duration"><option value="5">5 秒</option><option value="10">10 秒</option></select></label><label>旁白 / 字幕文本<textarea name="narration" rows="2" placeholder="本版导出 SRT，不自动配音"></textarea></label></div><div class="actions"><button type="button" id="enhanceImage">优化图片提示词</button><button type="button" id="enhanceVideo">优化动作提示词</button></div><p class="muted">修改提示词后，已有素材保留；需要手动重新生成。重新制作关键帧会清除当前视频选择。</p><footer><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">保存镜头</button></footer></form></dialog>
<div id="toast" role="status"></div><script src="/static/app.js"></script></body></html>
